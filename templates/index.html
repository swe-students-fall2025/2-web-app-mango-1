<!DOCTYPE html>
<html>
  <head>
    <title>Pomodoro App</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="/static/styles/index.css" />
  </head>
  <body>
    <div class="container">
      <header class="title">
        <h1>Pomodoro App</h1>
        <p class="tagline">Boost productivity with focused intervals!</p>
      </header>

      <div class="login-card">
        <!-- Route to home.html on successful submit -->
        <form id="loginForm">
          <label for="username">Username or Email</label>
          <input
            class="text"
            type="text"
            id="username"
            name="username"
            placeholder="Enter username or email"
            required
          />

          <label for="password">Password</label>
          <input
            class="password"
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            required
          />

          <button class="submit" type="submit">Log In</button>
          <a href="signup.html" class="sign-up-button">Sign Up</a>

          <!-- Error/Success Messages -->
          <div id="message" class="message" style="display: none"></div>
        </form>
      </div>
    </div>

    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const formData = {
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value,
          };

          const messageDiv = document.getElementById("message");
          messageDiv.style.display = "none";

          try {
            const response = await fetch("http://127.0.0.1:5000/auth/login", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify(formData),
              credentials: "include",
            });

            const data = await response.json();

            if (response.ok) {
              messageDiv.className = "message success";
              messageDiv.textContent = "Login successful! Redirecting...";
              messageDiv.style.display = "block";

              setTimeout(() => {
                window.location.href = "social.html";
              }, 1500);
            } else {
              messageDiv.className = "message error";
              messageDiv.textContent = data.error || "Invalid credentials";
              messageDiv.style.display = "block";
            }
          } catch (error) {
            console.error("Login error:", error);
            messageDiv.className = "message error";
            messageDiv.textContent =
              "Network error. Please check if the backend is running.";
            messageDiv.style.display = "block";
          }
        });
    </script>
  </body>
</html>
